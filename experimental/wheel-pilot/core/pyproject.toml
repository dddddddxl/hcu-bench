[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hcubench-core"
version = "0.1.0a3"
description = "Foreground benchmark contract pilot; no job runner"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hcubench = "hcubench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
