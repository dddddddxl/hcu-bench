name: Bench contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install control-side test dependencies
        run: python -m pip install -e '.[native]'
      - name: Test orchestration and native adapters without GPUs
        run: python -m unittest discover -s tests -v
