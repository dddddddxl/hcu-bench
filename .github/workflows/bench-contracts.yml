name: Bench contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install contract test dependencies
        run: python -m pip install -e '.[native,migraphx]'
      - name: Test Linux orchestration and native adapters without HCUs
        run: python -m unittest discover -s tests -v
