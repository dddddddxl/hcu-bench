name: RCCL wheel contracts

on:
  pull_request:
    paths:
      - experimental/wheel-pilot/**
      - .github/workflows/rccl-wheel.yml
  push:
    paths:
      - experimental/wheel-pilot/**
      - .github/workflows/rccl-wheel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install wheels from source
        run: python -m pip install ./experimental/wheel-pilot/core ./experimental/wheel-pilot/rccl-plugin
      - name: Check dependencies
        run: python -m pip check
      - name: Run contracts without hardware
        run: python -m unittest discover -s experimental/wheel-pilot/tests -v
