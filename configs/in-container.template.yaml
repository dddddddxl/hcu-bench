# 自己创建容器后使用；所有输入路径都填容器内路径，不需要 Docker socket。
# 在仓库目录复制为 configs/bench.yaml，修改 vars，然后 bash bench.sh rccl / pcie / memory / deepep / e2e / all。
# 本模板默认单机；需已有 Python 3.10+、PyYAML、psutil 和原生测试依赖。
version: 1
name: single-node-bench          # 测试方案名称，便于识别日志。
failure_policy: continue         # 普通失败清理后继续；改为 stop 可停止剩余项。
# 公共值只填一次；下方 ${vars.xxx} 会引用它们，不要把密码放进配置。
vars:
  workspace: /YOUR_WRITABLE_WORKSPACE       # 可写目录；自动创建 results/RUN_ID。
  bench_root: /YOUR_BENCH_REPO              # git clone 的仓库在容器内的绝对路径。
  rccl_binary: auto                        # 首次编译仓库源码；已有工具也可填绝对路径。
  rccl_ranks: 8                            # 一进程一卡，必须等于下方 hcus 数量。
  pcie_binary: auto                        # 固定 2.6.0 原生接口，首次自动编译。
  pcie_cpu_devices: "YOUR_CPU_DEVICE_IDS"   # 容器内运行该工具 -e 后填写，例如 "0,1"。
  pcie_hcu_devices: "YOUR_HCU_DEVICE_IDS"   # 例如 "2,3,4,5,6,7,8,9"；不是 HCU 卡号，须与 hcus 对应。
  memory_binary: auto                      # 使用仓库内 main-staging-1.0 源码。
  memory_hcus: "0"                         # 显存带宽单独选卡，必须属于下方 hcus；"0,1" 会逐卡串行。
  deepep_script: auto                      # 仓库内 11 字段 handle 的 daily 测试；须匹配镜像 DeepEP。
  qwen3_4b_path: /YOUR_MODELS/Qwen3-4B       # 默认两模型的本地权重路径，其他部署参数放启动脚本。
  qwen3_8b_path: /YOUR_MODELS/Qwen3-8B
  model_hcus: [0]                          # 默认模型BF16、TP1，串行复用指定单卡。
  dataset: auto                           # 内置 GSM8K test.jsonl；也可填本地 JSONL 路径。
  iface: YOUR_ACTIVE_INTERFACE             # 实际 socket 网卡。
  ib_hca: YOUR_ACTIVE_IB_HCA_LIST           # e2e NCCL_IB_HCA；如 mlx5_0，不照抄别的节点。
  gid: "YOUR_GID_INDEX"                     # 实际 RDMA GID，保留字符串引号，不能照搬其他节点。
  hcus: [0, 1, 2, 3, 4, 5, 6, 7]          # 本次允许使用的卡号，先确认没有其他业务。
  num_processes: 8                         # DeepEP 每节点进程数，应与 hcus 数量一致。
  duration_s: 600                          # 压测计划窗口（秒），含初始化；须小于 timeout_s。
build:                                    # 仅首次编译/缓存失效时使用，不修改镜像软件。
  dtk_root: /opt/dtk
  mpi_home: /opt/mpi                       # RCCL 使用镜像中的 Open MPI。
  arch: auto                              # rocminfo 唯一架构；也可填 gfx92a/gfx938。
  # arch_num: 9210                        # gfx92a 自动映射到 9210；其他特殊架构可显式填写。
  # compiler: /opt/dtk/bin/aicc            # memory 默认 AICC；RCCL 默认 hipcc。
  cache_dir: "${vars.workspace}/native-cache"
  jobs: 2
  timeout_s: 3600                         # 编译及双机准备等待时限，不占测试的 timeout_s。
output_dir: "${vars.workspace}/results"
nodes:
  node0:
    executor: local                       # 当前容器内执行，不连接 SSH、不再创建容器。
    hcus: "${vars.hcus}"
    env:
      HIP_VISIBLE_DEVICES: "${hcu_ids}"
      NCCL_IB_HCA: "${vars.ib_hca}"
      NCCL_SOCKET_IFNAME: "${vars.iface}"
      GLOO_SOCKET_IFNAME: "${vars.iface}"
  model_node:
    executor: local
    hcus: "${vars.model_hcus}"
    env:
      HIP_VISIBLE_DEVICES: "${hcu_ids}"
models:
  qwen3_4b:
    start_script: ./model_scripts/qwen3_4b.sh
    env:
      BENCH_MODEL_PATH: "${vars.qwen3_4b_path}"
    port: 30903                           # 脚本读取 BENCH_PORT；禁止后台化。
    # tokenizer_path: /YOUR_LOCAL_MODEL  # 服务返回模型目录不可用时才需填写。
  qwen3_8b:
    start_script: ./model_scripts/qwen3_8b.sh
    env:
      BENCH_MODEL_PATH: "${vars.qwen3_8b_path}"
    port: 30903
tests:
  # all 按 YAML 顺序串行执行；暂不测可加 enabled: false。
  rccl_allreduce:
    suite: rccl
    adapter: command
    pack: ../testpacks/rccl/manifest.yaml
    nodes: [node0]
    timeout_s: 600                         # 故障时限，超时不算正确性通过。
    params:
      bench_root: "${vars.bench_root}"
      binary: "${vars.rccl_binary}"
      ranks: "${vars.rccl_ranks}"
      min_bytes: 17179869184              # 16 GiB，等价于原生 -b 16G。
      max_bytes: 17179869184              # 固定 16 GiB，等价于原生 -e 16G。
      step_factor: 2
      datatype: half                     # half / float / double；归约操作为 sum。
      warmup_iters: 20
      iters: 50                          # 每个消息大小的测量迭代数。
  conv:
    enabled: true
    suite: operators
    adapter: command
    pack: ../testpacks/operators/numeric/manifest.yaml
    nodes: [node0]
    timeout_s: 7320
    params:
      bench_root: "${vars.bench_root}"
      recipe: conv
      mode: perf # 先原生正确性检查，再计时；默认使用已分配的第一张 HCU。
    matrix:
      dtype: [fp32, fp16]
  gemm:
    enabled: true
    suite: operators
    adapter: command
    pack: ../testpacks/operators/numeric/manifest.yaml
    nodes: [node0]
    timeout_s: 7320
    params:
      bench_root: "${vars.bench_root}"
      recipe: gemm
      gemm_profile: new # rocBLAS 5.2.0; select legacy explicitly for 4.3.0.
      mode: perf
      max_norm_error: "" # 非零误差且无阈值时不宣称正确性通过、不继续性能。
    matrix:
      dtype: [fp32, fp16, bf16]
  rccl_collectives:
    suite: rccl
    adapter: command
    pack: ../testpacks/rccl/manifest.yaml
    nodes: [node0]
    timeout_s: 600
    params:
      bench_root: "${vars.bench_root}"
      binary: "${vars.rccl_binary}"
      ranks: "${vars.rccl_ranks}"
      min_bytes: 17179869184
      max_bytes: 17179869184
    matrix:
      collective: [all_gather, reduce_scatter, broadcast, reduce, alltoall, alltoallv, gather, scatter, sendrecv]
  # 五类 PCIe 路径，固定大小逐对测试；不做正确性/长期压测，不使用 duration_s。
  pcie_bandwidth:
    suite: pcie
    adapter: command
    pack: ../testpacks/pcie/manifest.yaml
    nodes: [node0]
    timeout_s: 1800                       # 整个路径扫描的故障时限；不是压测时长。
    repeats: 1                           # 改成 3 可独立运行三轮，各轮单独归档。
    params:
      bench_root: "${vars.bench_root}"
      binary: "${vars.pcie_binary}"
      cpu_devices: "${vars.pcie_cpu_devices}"
      hcu_devices: "${vars.pcie_hcu_devices}"
      size_mib: 512                      # 单次拷贝大小，MiB；同时记录 Avg BW 和 Peak BW。
      iters: 20                          # 原生 ROCM_BW_ITER_CNT；不改频率或软件包。
  # 单卡显存/缓存/LDS 带宽，每张指定卡执行 zd1+zd2；和 PCIe 拷贝带宽分开。
  memory_bandwidth:
    suite: memory
    adapter: command
    pack: ../testpacks/memory/manifest.yaml
    nodes: [node0]
    timeout_s: 1800                       # 全部指定卡的故障时限，不配置 duration_s。
    repeats: 1
    params:
      bench_root: "${vars.bench_root}"
      binary: "${vars.memory_binary}"
      devices: "${vars.memory_hcus}"
      presets: both                      # both=24 项；也可选 zd1 或 zd2。
      model_mhz: 1400                    # 原脚本 MODEL 换算参数，不是实际锁频。
      array_size: 104857600              # 原生默认元素数，不是字节；部分用例不使用它。
  # bash bench.sh deepep 选择此项；num_processes 由原生脚本 spawn，不是 torchrun 入口数。
  deepep_pressure:
    suite: deepep
    adapter: command
    pack: ../testpacks/deepep/manifest.yaml # 相对于本 YAML；保留配置在 configs/ 下。
    nodes: [node0]
    duration_s: "${vars.duration_s}"
    timeout_s: 3600                        # 故障时限，不是计划时长；长压测须同步增大。
    params:
      bench_root: "${vars.bench_root}"
      test_script: "${vars.deepep_script}"
      master_addr: 127.0.0.1               # 本模板单机，使用回环地址。
      master_port: 29450                   # 选择未占用端口；成功重启周期会递增端口。
      num_processes: "${vars.num_processes}"
      num_tokens: 128                     # 每卡 token 数。
      hidden: 7168                        # hidden 维度。
      num_topk: 8                         # 每个 token 选择的 expert 数。
      num_experts: 256                    # expert 总数，须满足原生脚本的整除条件。
    env:
      # 字符串值；MNVL/XDP 等超节点参数按硬件提供，不在单机模板中强制开启。
      ROCSHMEM_HEAP_SIZE: "4737418240"
      HIP_BUFFER_EXTRA_SIZE: "0"
      NCCL_IB_DISABLE: "1"
      NCCL_SOCKET_IFNAME: "${vars.iface}"
      GLOO_SOCKET_IFNAME: "${vars.iface}"
      ROCSHMEM_IB_GID_INDEX: "${vars.gid}"
  # e2e 选择精度+性能，同一个模型只启动一次；e2e_acc 只跑此项。
  sglang_gsm8k:
    suite: e2e_acc
    models: all                           # 顶层models新增模型后自动纳入精度和性能。
    nodes: [model_node]
    timeout_s: 14400
    params:
      data_path: "${vars.dataset}"
      few_shot_path: auto                 # 训练集前5题作提示；测试集1319题全部评分。
      num_examples: 0                     # 0=全量。
      num_shots: 5
      max_tokens: 2048                    # 单题输出 token 上限。
      chat_template_kwargs: {enable_thinking: false}
      min_score: ""                       # 空字符串：只报告分数；有明确标准再填 "0.90" 等阈值。
  model_throughput:
    suite: e2e_perf
    models: all
    nodes: [model_node]
    timeout_s: 172800                      # 每模型31点；完整扫描可能耗时数小时以上。
    params:
      workloads:
        - {input_tokens: 128, output_tokens: 128, concurrency: [1, 4, 8, 16, 32, 64, 128]}
        - {input_tokens: 1024, output_tokens: 1024, concurrency: [1, 2, 4, 8, 16, 32, 64, 128]}
        - {input_tokens: 2048, output_tokens: 128, concurrency: [1, 2, 4, 8, 16, 32, 64, 128]}
        - {input_tokens: 3500, output_tokens: 1000, concurrency: [1, 2, 4, 8, 16, 32, 64, 128]}
      requests: 256
      warmup_requests: 32
      repeats: 1
      request_timeout_s: 1800
      extra_body: {chat_template_kwargs: {enable_thinking: false}}
