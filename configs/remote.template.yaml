# 控制机通过 SSH 在两台 Linux 节点运行原生 DeepEP；使用已有密钥或 SSH config。
# 复制为 configs/bench.yaml，填写 vars、节点信息和容器脚本后 bash bench.sh deepep。
# 两端挂载/clone 同一提交的仓库；原生 tests 已随仓库提供，不安装镜像依赖。
version: 1
name: remote-deepep
output_dir: ../runs              # 控制机目录，相对于此 YAML；日志和原生报告回传到这里。
failure_policy: continue
vars:
  bench_root: /YOUR_CONTAINER_BENCH_REPO
  deepep_script: auto             # 使用随仓库提供的 tests 和 utils。
  master_addr: YOUR_NODE0_REACHABLE_IP # 节点间可达的地址，不是控制机地址或 127.0.0.1。
  master_port: 29450              # 成功周期重启会递增端口，网络须允许这个范围。
  num_processes: 4                # 每节点 HCU 数，两节点需一致。
  duration_s: 600
nodes:
  node0:
    executor: ssh
    host: YOUR_SSH_ALIAS_OR_IP
    user: YOUR_USER               # SSH config 已配置用户时可删除此字段。
    python: python3              # 宿主机 worker 解释器；测试在容器内 Python 3.10+ 执行。
    work_root: /YOUR_HOST_WORKSPACE/bench-runs
    hcus: [0, 1, 2, 3]
    env:
      HIP_VISIBLE_DEVICES: "${hcu_ids}"
      NCCL_SOCKET_IFNAME: YOUR_NODE0_ACTIVE_INTERFACE
      GLOO_SOCKET_IFNAME: YOUR_NODE0_ACTIVE_INTERFACE
      ROCSHMEM_IB_GID_INDEX: "YOUR_NODE0_GID_INDEX"
  node1:
    executor: ssh
    host: YOUR_SECOND_SSH_ALIAS_OR_IP
    user: YOUR_USER
    python: python3
    work_root: /YOUR_HOST_WORKSPACE/bench-runs
    hcus: [0, 1, 2, 3]
    env:
      HIP_VISIBLE_DEVICES: "${hcu_ids}"
      NCCL_SOCKET_IFNAME: YOUR_NODE1_ACTIVE_INTERFACE
      GLOO_SOCKET_IFNAME: YOUR_NODE1_ACTIVE_INTERFACE
      ROCSHMEM_IB_GID_INDEX: "YOUR_NODE1_GID_INDEX"
containers:
  image_under_test:
    mode: managed                # 也可改为 existing；见 docs/quick-run.md。
    work_root: /YOUR_CONTAINER_WORKSPACE/bench-runs
    name: "bench-${run_id}-${case_id}-${node_id}"
    # 脚本在各目标宿主机执行，负责指定镜像、设备、权限、挂载和空闲检查。
    start: [bash, /YOUR_HOST_WORKSPACE/start_container.sh, "${container_name}"]
    check: [bash, /YOUR_HOST_WORKSPACE/check_container_running.sh, "${container_name}"]
    stop: [bash, /YOUR_HOST_WORKSPACE/stop_container.sh, "${container_name}"]
    hook_timeout_s: 120
    exec_prefix: [docker, exec, -i, "${container_name}", python3, -u]
tests:
  deepep_pressure:
    suite: deepep
    adapter: command
    pack: ../testpacks/deepep/manifest.yaml # 已接入的原生包装器，不再使用占位入口。
    nodes: [node0, node1]         # 列表顺序决定 node_rank；两端同时启动本用例。
    container: image_under_test
    duration_s: "${vars.duration_s}"
    timeout_s: 3600              # 故障时限，必须大于 duration_s。
    params:
      bench_root: "${vars.bench_root}"
      test_script: "${vars.deepep_script}"
      master_addr: "${vars.master_addr}"
      master_port: "${vars.master_port}"
      num_processes: "${vars.num_processes}"
      num_tokens: 128
      hidden: 7168
      num_topk: 8
      num_experts: 256
    env:
      ROCSHMEM_HEAP_SIZE: "4737418240"
      HIP_BUFFER_EXTRA_SIZE: "0"
      NCCL_IB_DISABLE: "1"
      # 其他 RDMA/MNVL/XDP 参数按实际硬件及原生测试要求添加，不套用别的节点。
