version: 1
name: five-suite-framework-demo
output_dir: ../runs
failure_policy: continue
nodes:
  local:
    executor: local
tests:
  rccl_demo:
    suite: rccl
    adapter: mock
    nodes: [local]
    params: {payload_bytes: 1024}
    matrix: {payload_bytes: [1024, 4096]}
    timeout_s: 10
  deepep_demo:
    suite: deepep
    adapter: mock
    nodes: [local]
    params: {samples: 3}
    timeout_s: 10
  mooncake_demo:
    suite: mooncake
    adapter: mock
    nodes: [local]
    params: {samples: 3}
    timeout_s: 10
  operators_demo:
    suite: operators
    adapter: mock
    nodes: [local]
    params: {samples: 3}
    timeout_s: 10
  e2e_demo:
    suite: e2e
    adapter: mock
    nodes: [local]
    params: {samples: 3}
    timeout_s: 10
