# 自动建容器模式：在 Linux Docker 宿主机控制环境执行，不是在待测容器内执行。
# 需已有 Python 3.10+、PyYAML、Docker，以及你提供的容器 start/check/stop 脚本。
# 复制为 configs/bench.yaml，修改 vars，然后 bash bench.sh rccl / pcie / memory / deepep / e2e / all。
version: 1
name: managed-single-node-bench   # 测试方案名称。
failure_policy: continue         # 普通失败清理后继续；stop 可停止剩余项。
# 区分宿主机与容器路径；启动脚本负责正确挂载，不猜设备、权限或挂载关系。
vars:
  host_workspace: /YOUR_HOST_WORKSPACE               # 宿主机输出目录，须可写。
  container_workspace: /YOUR_CONTAINER_WORKSPACE     # 容器内工作目录，须可写。
  bench_root: /YOUR_CONTAINER_BENCH_REPO              # 容器内仓库路径，启动脚本需挂载代码。
  rccl_binary: auto                                  # 容器内首次编译仓库源码。
  rccl_ranks: 8                                      # 一进程一卡，须等于 hcus 数量。
  pcie_binary: auto                                  # 也可填容器内已有工具绝对路径。
  pcie_cpu_devices: "YOUR_CPU_DEVICE_IDS"             # 在相同容器/可见性环境执行 -e 后填写。
  pcie_hcu_devices: "YOUR_HCU_DEVICE_IDS"             # 工具 Device ID，须与下方 hcus 实际对应。
  memory_binary: auto                                # 使用随仓库提供的源码。
  memory_hcus: "0"                                   # 必须属于下方 hcus；"0,1" 会逐卡串行。
  container_hook: /YOUR_HOST_SCRIPTS/container.sh     # 宿主机上的用户脚本，接口见下方 containers。
  image: YOUR_APPROVED_IMAGE                         # 已确认的待测镜像，工具不自动升级。
  deepep_script: auto                                # 内置 daily 11 字段 handle 测试。
  # 下列输入均为容器内路径；只跑 deepep 时可暂不填写精度输入。
  model: /YOUR_CONTAINER_MODELS/DeepSeek-V4-Flash-Channel-INT8-w8a8
  dataset: auto                                      # 内置 GSM8K test.jsonl。
  profile: auto                                      # 内置 Flash INT8 / BW1100 8 卡配方。
  ep_config: auto                                    # 内置 EP 参考配置。
  iface: YOUR_ACTIVE_INTERFACE                       # 实际 socket 网卡。
  ib_hca: YOUR_ACTIVE_IB_HCA_LIST                     # e2e 的实际 RDMA HCA 列表。
  gid: "YOUR_GID_INDEX"                               # 实际 RDMA GID；字符串，不照搬别的节点。
  hcus: [0, 1, 2, 3, 4, 5, 6, 7]                    # 实际可用卡号，启动前检查占用。
  num_processes: 8                                   # DeepEP 每节点进程数，与卡号数量一致。
  duration_s: 600                                    # 压测计划窗口（秒），含初始化。
build:
  dtk_root: /opt/dtk
  mpi_home: /opt/mpi
  arch: auto
  cache_dir: "${vars.container_workspace}/native-cache" # 必须挂载到宿主机，容器删除后仍保留。
  jobs: 2
  timeout_s: 3600
output_dir: "${vars.host_workspace}/results"
nodes:
  node0:
    executor: local                                 # 此模板在当前宿主机执行 Docker 命令。
    hcus: "${vars.hcus}"
    env:
      HIP_VISIBLE_DEVICES: "${hcu_ids}"
      NCCL_IB_HCA: "${vars.ib_hca}"
      NCCL_SOCKET_IFNAME: "${vars.iface}"
      GLOO_SOCKET_IFNAME: "${vars.iface}"
containers:
  test_image:
    mode: managed                                   # 每用例创建/清理自有容器，不接管现有容器。
    name: "bench-${run_id}-${case_id}-${node_id}"     # 必须保留三个变量，避免容器名冲突。
    work_root: "${vars.container_workspace}/workers" # 容器内执行和报告目录。
    # 以下是 argv 列表，不是 shell 字符串；可改成你现有脚本的参数形式。
    # start 接收 NAME IMAGE HOST_WORKSPACE CONTAINER_WORKSPACE，创建完后返回。
    start: [bash, "${vars.container_hook}", start, "${container_name}", "${vars.image}", "${vars.host_workspace}", "${vars.container_workspace}"]
    # check：运行中返回 0，不存在/已停止返回 1，检查失败返回其他非零值。
    check: [bash, "${vars.container_hook}", check, "${container_name}"]
    # stop：只清理本次创建的 NAME；确认清理返回 0，失败返回非零。
    stop: [bash, "${vars.container_hook}", stop, "${container_name}"]
    hook_timeout_s: 120                              # 每个容器脚本动作的故障时限（秒）。
tests:
  # all 串行执行启用项；暂不测可加 enabled: false。RCCL 不使用 duration_s。
  rccl_allreduce:
    suite: rccl
    adapter: command
    pack: ../testpacks/rccl/manifest.yaml
    nodes: [node0]
    container: test_image
    timeout_s: 600
    params:
      bench_root: "${vars.bench_root}"
      binary: "${vars.rccl_binary}"
      ranks: "${vars.rccl_ranks}"
      min_bytes: 8192                               # 8 KiB，单位字节。
      max_bytes: 67108864                           # 64 MiB，必须落在倍增序列上。
      step_factor: 2
      datatype: half                               # half / float / double，操作默认为 sum。
      warmup_iters: 20
      iters: 50                                    # 每个消息大小的测量迭代数。
  pcie_bandwidth:
    suite: pcie
    adapter: command
    pack: ../testpacks/pcie/manifest.yaml
    nodes: [node0]
    container: test_image
    timeout_s: 1800                                  # 整个路径扫描的故障时限。
    repeats: 1                                      # 需要三轮独立复测时改成 3。
    params:
      bench_root: "${vars.bench_root}"
      binary: "${vars.pcie_binary}"
      cpu_devices: "${vars.pcie_cpu_devices}"
      hcu_devices: "${vars.pcie_hcu_devices}"
      size_mib: 512                                 # MiB，不使用全矩阵默认大小。
      iters: 20                                     # ROCM_BW_ITER_CNT，不做独立数据校验。
  memory_bandwidth:
    suite: memory
    adapter: command
    pack: ../testpacks/memory/manifest.yaml
    nodes: [node0]
    container: test_image
    timeout_s: 1800                                  # 全部指定卡的故障时限，不配置 duration_s。
    repeats: 1
    params:
      bench_root: "${vars.bench_root}"
      binary: "${vars.memory_binary}"
      devices: "${vars.memory_hcus}"
      presets: both                                 # zd1+zd2 共 24 项，逐卡执行。
      model_mhz: 1400                               # MODEL 换算参数，不锁频。
      array_size: 104857600                         # 原生默认元素数，不是 MiB。
  # 原生 DeepEP 压测；脚本及依赖必须已存在于容器，不由工具安装。
  deepep_pressure:
    suite: deepep
    adapter: command
    pack: ../testpacks/deepep/manifest.yaml           # 控制端相对于本 YAML 的路径。
    nodes: [node0]
    container: test_image
    duration_s: "${vars.duration_s}"
    timeout_s: 3600                                  # 须大于 duration_s；长压测同步增大。
    params:
      bench_root: "${vars.bench_root}"
      test_script: "${vars.deepep_script}"
      master_addr: 127.0.0.1                         # 本模板单机。
      master_port: 29450                             # 选择未占用端口，成功重启周期会递增。
      num_processes: "${vars.num_processes}"
      num_tokens: 128                               # 每卡 token 数。
      hidden: 7168                                  # hidden 维度。
      num_topk: 8                                   # 每个 token 选择的 expert 数。
      num_experts: 256                              # expert 总数，须符合原生脚本约束。
    env:
      # 字符串值；MNVL/XDP 参数按实际硬件补充，不默认强制开启。
      ROCSHMEM_HEAP_SIZE: "4737418240"
      HIP_BUFFER_EXTRA_SIZE: "0"
      NCCL_IB_DISABLE: "1"
      NCCL_SOCKET_IFNAME: "${vars.iface}"
      GLOO_SOCKET_IFNAME: "${vars.iface}"
      ROCSHMEM_IB_GID_INDEX: "${vars.gid}"
  # 单节点 Flash INT8 精度测试，参考服务配方要求 BW1100 8 卡。
  sglang_gsm8k:
    suite: e2e
    adapter: command
    pack: ../testpacks/sglang_accuracy/manifest.yaml
    nodes: [node0]
    container: test_image
    timeout_s: 5400                                  # 包含模型加载、评测和服务清理。
    params:
      bench_root: "${vars.bench_root}"
      profile: "${vars.profile}"
      model_path: "${vars.model}"
      data_path: "${vars.dataset}"
      ep_config: "${vars.ep_config}"
      port: 30903                                   # 必须未占用，不复用他人的服务。
      num_examples: 100                             # 实际评分题数，排除 few-shot 样例。
      num_shots: 5                                  # 前 5 条用作提示样例。
      max_tokens: 2048                              # 单题输出 token 上限。
      min_score: ""                                 # 只报告分数；有明确标准后再填阈值。
