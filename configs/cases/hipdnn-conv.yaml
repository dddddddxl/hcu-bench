# Run the unchanged DTK test_conv.sh set, using the existing complete DTK environment.
version: 1
name: dtk-hipdnn-conv
failure_policy: continue
vars:
  bench_root: /YOUR_BENCH_REPO
  workspace: /YOUR_WRITABLE_WORKSPACE
  hcus: [0]
output_dir: "${vars.workspace}/results"
nodes:
  single:
    executor: local
    hcus: "${vars.hcus}"
    env:
      HIP_VISIBLE_DEVICES: "${hcu_ids}"
tests:
  hipdnn_conv:
    enabled: true
    suite: operators
    adapter: command
    pack: ../../testpacks/operators/hipdnn_conv/manifest.yaml
    nodes: [single]
    timeout_s: 14520
    params:
      bench_root: "${vars.bench_root}"
      binary: auto
      source_root: "" # Empty: reuse installed test_conv, otherwise build the bundled DTK api_test source.
      native_timeout_s: 14400
