# 已有兼容rocblas-bench容器内执行；默认先按原生unit_check校验再测性能。
version: 1
name: gemm-correctness-and-performance
failure_policy: continue
vars:
  bench_root: /YOUR_BENCH_REPO
  workspace: /YOUR_WRITABLE_WORKSPACE
  hcus: [0]
output_dir: "${vars.workspace}/results"
nodes:
  single:
    executor: local
    hcus: "${vars.hcus}"
    env:
      HIP_VISIBLE_DEVICES: "${hcu_ids}"
tests:
  gemm:
    enabled: true
    suite: operators
    adapter: command
    pack: ../../testpacks/operators/numeric/manifest.yaml
    nodes: [single]
    timeout_s: 7320
    params:
      bench_root: "${vars.bench_root}"
      recipe: gemm
      gemm_profile: new                  # 5.2.0接口用new，4.3.0接口显式选legacy。
      rocblas_bench: auto                # 检查镜像已有工具，不安装或替换原生库。
      mode: perf                        # check=只校验；perf=校验通过后计时。
      group: all # all / general / smoke；默认仅 DTK 原始条目。
      case_id: ""                       # 空=全部配方；单项诊断可填dtk-smoke-59-0001。
      max_norm_error: "" # 默认原生校验；非空阈值追加 norm 检查。
      native_timeout_s: 7200
    matrix:
      dtype: [fp32, fp16, fp64, complex64, complex128]
