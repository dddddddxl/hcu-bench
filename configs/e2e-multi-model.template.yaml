# 在已有容器中运行：复制为 configs/bench.yaml，编辑模型脚本后 bash bench.sh e2e。
# e2e_acc / e2e_perf 可分别运行；e2e 同时选中两者，每个模型只启动一次。
version: 1
name: multi-model-e2e
failure_policy: continue       # 服务健康才继续下一任务；清理失败总是停止。
vars:
  workspace: /YOUR_WRITABLE_WORKSPACE
  bench_root: /YOUR_BENCH_REPO  # 执行环境内完整仓库的绝对路径。
  qwen3_4b_path: /YOUR_MODELS/Qwen3-4B
  qwen3_8b_path: /YOUR_MODELS/Qwen3-8B
output_dir: "${vars.workspace}/results"
build:
  cache_dir: "${vars.workspace}/client-cache" # 独立客户端 Python，不升级服务镜像的库。
  timeout_s: 3600             # 首次客户端安装时限，独立于正式测试。
nodes:
  node0:
    executor: local
    hcus: [0]                # 两个默认模型均为BF16、TP1，串行复用这张卡。
    env:
      HIP_VISIBLE_DEVICES: "${hcu_ids}"
models:
  qwen3_4b:
    start_script: ./model_scripts/qwen3_4b.sh # 默认脚本随仓库提供，其他部署参数放脚本。
    env:
      BENCH_MODEL_PATH: "${vars.qwen3_4b_path}"
    port: 30000              # 脚本读取 BENCH_PORT，前台 exec，不用 nohup/&。
    startup_timeout_s: 1800
    # tokenizer_path: /models/model-a # 服务返回的目录不可用时填写，不自动下载。
    # model_name: model-a            # 服务发布多个模型名时填写精确 ID。
    # before_perf_script: ./model_scripts/reset-cache.local.sh # 可选的缓存重置脚本。
  qwen3_8b:
    start_script: ./model_scripts/qwen3_8b.sh
    env:
      BENCH_MODEL_PATH: "${vars.qwen3_8b_path}"
    port: 30000              # 串行运行，前一模型退出后复用端口。
    # nodes: [node0]         # 可覆盖测试项的 nodes/container，仍仅支持单节点服务。
    # container: another_image
tests:
  accuracy:
    suite: e2e_acc
    models: all              # 新模型只需添加到顶层models；也可写[qwen3_4b]只测一个。
    nodes: [node0]
    timeout_s: 14400
    params:
      dataset: gsm8k
      data_path: auto        # 内置test集全部1319题；不从评分题中扣few-shot。
      few_shot_path: auto    # 内置训练集前5题。
      num_examples: 0        # 0=全量评分。
      num_shots: 5
      max_tokens: 2048
      chat_template_kwargs: {enable_thinking: false}
      min_score: ""          # 只报分数，不默认判定精度通过。
  performance:
    suite: e2e_perf
    models: all
    nodes: [node0]
    timeout_s: 172800        # 每模型31点的总故障时限；完整扫描可能需要数小时以上。
    params:
      # 月英表已有数据：每模型31点；128/128不含并发2，各组均不含256。
      workloads:
        - {input_tokens: 128, output_tokens: 128, concurrency: [1, 4, 8, 16, 32, 64, 128]}
        - {input_tokens: 1024, output_tokens: 1024, concurrency: [1, 2, 4, 8, 16, 32, 64, 128]}
        - {input_tokens: 2048, output_tokens: 128, concurrency: [1, 2, 4, 8, 16, 32, 64, 128]}
        - {input_tokens: 3500, output_tokens: 1000, concurrency: [1, 2, 4, 8, 16, 32, 64, 128]}
      requests: 256          # 每个组合的正式请求数，至少等于最大并发。
      warmup_requests: 32    # 每个组合独立预热，排除在正式统计之外。
      repeats: 1            # 用户确认的默认轮数，不是表中给出的原始轮数。
      seed: 42
      request_timeout_s: 1800
      extra_body: {chat_template_kwargs: {enable_thinking: false}}
      python: auto          # 自动准备固定 EvalScope，也可填已有 1.13.0 客户端 Python。
