# 在已有容器内顺序评测两个模型；模型需兼容 SGLang 0.5.12 GSM8K 接口。
# 这只是多模型编排模板，不是两个模型的已验证部署配方。
# 复制为 configs/bench.yaml，填写 vars 后 bash bench.sh e2e。
version: 1
name: multi-model-gsm8k
failure_policy: continue        # 当前模型失败并确认清理后，继续下一个；可改为 stop。
vars:
  workspace: /YOUR_WRITABLE_WORKSPACE
  bench_root: /YOUR_BENCH_REPO
  hcus: [0, 1, 2, 3, 4, 5, 6, 7] # 须与 serving.visible_hcus 一致。
  dataset: auto                 # 仓库自带 GSM8K；也可指定自己的 JSONL。
  iface: YOUR_SOCKET_INTERFACE
  ib_hca: YOUR_ACTIVE_IB_HCA_LIST
  model_a: /YOUR_LOCAL_MODELS/model-a
  model_b: /YOUR_LOCAL_MODELS/model-b
output_dir: "${vars.workspace}/results"
nodes:
  node0:
    executor: local
    hcus: "${vars.hcus}"
    env:
      HIP_VISIBLE_DEVICES: "${hcu_ids}"
      NCCL_IB_HCA: "${vars.ib_hca}"
      NCCL_SOCKET_IFNAME: "${vars.iface}"
      GLOO_SOCKET_IFNAME: "${vars.iface}"
tests:
  model_a_gsm8k:                # 名称出现在报告中，两个模型不要使用同一个测试名。
    suite: e2e
    adapter: command
    pack: ../testpacks/sglang_accuracy/manifest.yaml
    nodes: [node0]              # 当前仅支持单节点服务，不通过增加 nodes 启动多机模型。
    timeout_s: 5400             # 包括模型加载和评测；不设置 duration_s。
    params:
      bench_root: "${vars.bench_root}"
      model_path: "${vars.model_a}"
      profile: auto            # 内置 Flash INT8 8 卡模板，只适用于兼容模型。
      ep_config: auto
      serving:
        name: model-a
        visible_hcus: 8
      data_path: "${vars.dataset}"
      port: 30903              # 必须未被其他服务占用。
      num_examples: 100
      num_shots: 5
      max_tokens: 2048
      min_score: ""            # 只报告分数；有明确标准后再填字符串阈值。
  model_b_gsm8k:
    suite: e2e
    adapter: command
    pack: ../testpacks/sglang_accuracy/manifest.yaml
    nodes: [node0]
    timeout_s: 5400
    params:
      bench_root: "${vars.bench_root}"
      model_path: "${vars.model_b}"
      profile: auto
      ep_config: auto
      serving:
        name: model-b
        visible_hcus: 8
        # 需要改启动命令时，取消下面注释并填写完整 argv 列表。
        # server_argv 替换内置命令；env 合并内置环境，unset_env 删除不需要的环境。
        # 示例不是任意模型的通用配方，其他模型须同步检查 env/EP 等设置。
        # server_argv: [sglang, serve, --model-path, "${model_path}", --tp, "8",
        #               --host, "${host}", --port, "${port}"]
      data_path: "${vars.dataset}"
      port: 30904
      num_examples: 100
      num_shots: 5
      max_tokens: 2048
      min_score: ""
