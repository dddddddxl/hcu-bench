[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hcu-bench"
version = "0.1.0"
description = "CLI orchestration for communication, operator and end-to-end benchmarks"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
hcu-bench = "hcu_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
